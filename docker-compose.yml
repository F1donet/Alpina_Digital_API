services:
  stt_django:
    image: ghcr.io/f1donet/alpina_digital_api:latest
    container_name: stt_django
    build:
      context: .
    env_file:
      - venv
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    ports:
      - "8000:8000"
    depends_on:
      - stt_pgdb
    networks:
      - backend

  stt_celery:
    image: ghcr.io/f1donet/alpina_digital_api:latest
    command: celery -A config worker --loglevel=info --concurrency=2
    container_name: stt_celery
    env_file:
      - venv
    volumes:
      - ./media:/app/media
    depends_on:
      - stt_django
    networks:
      - backend

  stt_celery_beat:
    image: ghcr.io/f1donet/alpina_digital_api:latest
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    container_name: stt_celery_beat
    env_file:
      - venv
    depends_on:
      - stt_django
      - stt_pgdb
    networks:
      - backend

  stt_pgdb:
    image: postgres
    container_name: stt_pgdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - backend

  stt_redis:
    image: redis
    container_name: stt_redis
    ports:
      - "6379:6379"
    networks:
      - backend

  stt_nginx:
      image: nginx:alpine
      container_name: stt_nginx
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./nginx/conf.d:/etc/nginx/conf.d:ro
        - ./static:/app/static
        - ./media:/app/media
        - ./nginx/certbot/conf:/etc/letsencrypt
        - ./nginx/certbot/www:/var/www/certbot
      depends_on:
        - stt_django
      networks:
        - backend
      restart: always

volumes:
  pgdata:

networks:
  backend:
    name: backend
    driver: bridge
